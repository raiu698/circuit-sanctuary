<text x="242" y="140" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#F4F7F5">Circuit Sanctuary</text>
<text x="242" y="184" font-family="DejaVu Sans" font-size="27" fill="#3FD99A">Electronics repair &#183; Haleyville, AL</text>
<text x="90" y="330" font-family="DejaVu Sans" font-size="76" font-weight="bold" fill="#F4F7F5">Stop spam calls</text>
<text x="90" y="470" font-family="DejaVu Sans" font-size="46" fill="#F4F7F5">Tired of the robocalls?</text>
<text x="90" y="556" font-family="DejaVu Sans" font-size="34" fill="#9BA6A2">I&#8217;ll set your phone up so they stop</text>
<text x="90" y="606" font-family="DejaVu Sans" font-size="34" fill="#9BA6A2">getting through. Takes about twenty</text>
<text x="90" y="656" font-family="DejaVu Sans" font-size="34" fill="#9BA6A2">minutes, and it sticks.</text>
<rect x="90" y="756" width="580" height="100" rx="50" fill="#3FD99A"/>
<text x="380" y="820" text-anchor="middle" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#06231A">Call and ask about it</text>
<line x1="90" y1="1058" x2="1110" y2="1058" stroke="#26302C" stroke-width="2"/>
<text x="90" y="1122" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#3FD99A">(205) 435-4958</text>
<text x="1110" y="1122" text-anchor="end" font-family="DejaVu Sans" font-size="28" fill="#9BA6A2">Mon&#8211;Sat 7am&#8211;6pm</text>
