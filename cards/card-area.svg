<text x="242" y="140" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#F4F7F5">Circuit Sanctuary</text>
<text x="242" y="184" font-family="DejaVu Sans" font-size="27" fill="#3FD99A">Electronics repair &#183; Haleyville, AL</text>
<text x="90" y="330" font-family="DejaVu Sans" font-size="76" font-weight="bold" fill="#F4F7F5">Where I go</text>
<text x="90" y="460" font-family="DejaVu Sans" font-size="38" fill="#F4F7F5">Haleyville &#183; Winfield &#183; Hamilton</text>
<text x="90" y="526" font-family="DejaVu Sans" font-size="38" fill="#F4F7F5">Russellville &#183; Double Springs</text>
<text x="90" y="592" font-family="DejaVu Sans" font-size="38" fill="#F4F7F5">Hackleburg &#183; Red Bay &#183; Jasper</text>
<text x="90" y="658" font-family="DejaVu Sans" font-size="38" fill="#F4F7F5">Fayette &#183; Vernon</text>
<text x="90" y="752" font-family="DejaVu Sans" font-size="32" fill="#9BA6A2">&#8212; and most places within about fifty miles.</text>
<text x="90" y="850" font-family="DejaVu Sans" font-size="32" fill="#9BA6A2">No storefront. I work out of my own shop,</text>
<text x="90" y="898" font-family="DejaVu Sans" font-size="32" fill="#9BA6A2">which is why the rates are what they are.</text>
